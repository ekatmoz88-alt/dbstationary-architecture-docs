<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title | default: 'DbStationary Architecture Documentation' }}</title>
  <link rel="stylesheet" href="{{ '/assets/reference-theme.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">DbStationary · SQLite Architecture</a>
    <nav class="top-links" aria-label="External links">
      <a href="https://github.com/ekatmoz88-alt/dbstationary-architecture-docs" target="_blank" rel="noopener">GitHub repository</a>
      <a href="https://github.com/ekatmoz88-alt" target="_blank" rel="noopener">GitHub profile</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Documentation navigation">
      <p class="sidebar-label">Documentation</p>
      <details class="side-group" open>
        <summary>Project</summary>
        <nav class="side-links">
          <a href="{{ '/' | relative_url }}">Overview</a>
          <a href="{{ '/README.html' | relative_url }}">README</a>
        </nav>
      </details>
      <details class="side-group" open>
        <summary>Architecture and API</summary>
        <nav class="side-links">
          <a href="{{ '/ARCHITECTURE.html' | relative_url }}">Architecture overview</a>
          <a href="{{ '/API_REFERENCE.html' | relative_url }}">API reference</a>
        </nav>
      </details>
    </aside>

    <main class="content">
      <div class="content-inner">
        {{ content }}
      </div>
    </main>
  </div>

  <!-- Render fenced Mermaid blocks as SVG with Mermaid.js v10. -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      // Kramdown wraps fenced blocks in:
      // div.language-mermaid > div.highlight > pre > code
      // Replace the complete wrapper, not just its inner code element.
      document.querySelectorAll('div.language-mermaid').forEach(function(wrapper) {
        var code = wrapper.querySelector('pre code, code');
        if (!code) return;

        var diagram = document.createElement('pre');
        diagram.className = 'mermaid';
        diagram.textContent = code.textContent.trim();
        wrapper.replaceWith(diagram);
      });

      // Also support Markdown renderers that put the language class on <pre>.
      document.querySelectorAll('pre.language-mermaid').forEach(function(block) {
        block.classList.remove('language-mermaid');
        block.classList.add('mermaid');
      });

      // Support renderers that put the language class directly on <code>.
      document.querySelectorAll('pre code.language-mermaid').forEach(function(code) {
        var diagram = document.createElement('pre');
        diagram.className = 'mermaid';
        diagram.textContent = code.textContent.trim();
        code.parentElement.replaceWith(diagram);
      });

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: 'default',
        flowchart: { htmlLabels: false }
      });

      try {
        await mermaid.run({ querySelector: 'pre.mermaid' });
      } catch (error) {
        console.error('Mermaid rendering failed:', error);
      }
    });
  </script>
</body>
</html>
