<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title | default: 'DbStationary Architecture Documentation' }}</title>
  <link rel="stylesheet" href="{{ '/assets/reference-theme.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">DbStationary · SQLite Architecture</a>
    <nav class="top-links" aria-label="External links">
      <a href="https://github.com/ekatmoz88-alt/dbstationary-architecture-docs" target="_blank" rel="noopener">GitHub repository</a>
      <a href="https://github.com/ekatmoz88-alt" target="_blank" rel="noopener">GitHub profile</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Documentation navigation">
      <p class="sidebar-label">Documentation</p>
      <details class="side-group" open>
        <summary>Project</summary>
        <nav class="side-links">
          <a href="{{ '/' | relative_url }}">Overview</a>
          <a href="{{ '/README.html' | relative_url }}">README</a>
        </nav>
      </details>
      <details class="side-group" open>
        <summary>Architecture and API</summary>
        <nav class="side-links">
          <a href="{{ '/ARCHITECTURE.html' | relative_url }}">Architecture overview</a>
          <a href="{{ '/API_REFERENCE.html' | relative_url }}">API reference</a>
        </nav>
      </details>
    </aside>

    <main class="content">
      <div class="content-inner">
        {{ content }}
      </div>
    </main>
  </div>

  <!-- Mermaid.js v10: preserve rendering of fenced Mermaid diagrams. -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var codeBlocks = document.querySelectorAll('div.language-mermaid code, pre code.language-mermaid');

      codeBlocks.forEach(function(block) {
        var content = block.textContent;
        var mermaidDiv = document.createElement('div');
        mermaidDiv.className = 'mermaid';
        mermaidDiv.textContent = content;

        if (block.parentNode.tagName === 'PRE') {
          block.parentNode.replaceChild(mermaidDiv, block);
        } else if (block.parentNode.classList && block.parentNode.classList.contains('language-mermaid')) {
          block.parentNode.replaceChild(mermaidDiv, block);
        } else {
          block.replaceWith(mermaidDiv);
        }
      });

      mermaid.initialize({
        startOnLoad: false,
        elementSelector: '.mermaid',
        theme: 'default'
      });
      mermaid.run();
    });
  </script>
</body>
</html>
